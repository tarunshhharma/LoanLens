# Render Blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: loanlens
    runtime: docker
    plan: free
    dockerCommand: sh deploy/start.sh
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass  # deploy only after CI passes on the commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # a secret: typed into Render's dashboard, never stored in the repo
      - key: LOANLENS_ACCESS_CODE
        sync: false
